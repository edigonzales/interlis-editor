<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      background: var(--theia-editor-background, #f7f7f7);
    }

    .theia-preload {
      position: absolute;
      inset: 0;
      background-image: none;
    }

    .theia-preload::after {
      content: none;
    }

    .interlis-preload {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #30343b;
    }

    .interlis-preload p {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="interlis-preload"><p>Starting INTERLIS Editor…</p></div>
</body>
</html>
